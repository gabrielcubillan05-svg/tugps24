# Robot de pagos: aplica en el sistema de pagos (GeneXus) los comprobantes en verde del panel.
# Se ejecuta a mano desde la pestaña Actions mientras se configura; cuando el robot tenga los
# pasos de GeneXus y los secretos (PANEL_URL, ROBOT_PAGOS_TOKEN, GENEXUS_URL, GENEXUS_USER,
# GENEXUS_PASS) cargados en Settings → Secrets, se quita el comentario del horario.
name: Robot de pagos

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'latido · verificar-acceso · explorar-pagos (lee sin tocar) · ingestar (trae pendientes al panel, no aprueba) · aplicar (trae y aprueba)'
        type: choice
        default: latido
        options: [latido, verificar-acceso, explorar-pagos, ingestar, aplicar]
      maximo:
        description: 'Cuántos pagos aprobar en esta corrida (modo aplicar)'
        type: string
        default: '5'
  # Cada 20 min, 6 a. m. a 9:40 p. m. Colombia (UTC-5), todos los días. Aprobado por Gabriel el 2026-10-07.
  schedule:
    - cron: '*/20 11-23 * * *'
    - cron: '*/20 0-2 * * *'

concurrency:
  group: robot-pagos
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Caché del navegador
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('robot/pagos-genexus/package.json') }}
      - name: Instalar Playwright
        working-directory: robot/pagos-genexus
        run: npm install && npx playwright install --with-deps chromium
      - name: Correr el robot
        working-directory: robot/pagos-genexus
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          ROBOT_PAGOS_TOKEN: ${{ secrets.ROBOT_PAGOS_TOKEN }}
          GENEXUS_URL: ${{ secrets.GENEXUS_URL }}
          GENEXUS_USER: ${{ secrets.GENEXUS_USER }}
          GENEXUS_PASS: ${{ secrets.GENEXUS_PASS }}
          # Las corridas programadas arrancan en modo ingestar (sombra): el robot trae y GPSITO
          # clasifica, Kelly aprueba en Optimus como siempre. Cuando se confirme que el semáforo
          # coincide con lo que ella aprueba, se cambia aquí a 'aplicar'.
          MODO: ${{ inputs.modo || 'ingestar' }}
          MAX_POR_CICLO: ${{ inputs.maximo || '5' }}
        run: node robot.mjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-robot
          path: robot/pagos-genexus/salida/
          if-no-files-found: ignore
          retention-days: 7
