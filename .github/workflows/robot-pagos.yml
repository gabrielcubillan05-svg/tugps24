# Robot de pagos: aplica en el sistema de pagos (GeneXus) los comprobantes en verde del panel.
# Se ejecuta a mano desde la pestaña Actions mientras se configura; cuando el robot tenga los
# pasos de GeneXus y los secretos (PANEL_URL, ROBOT_PAGOS_TOKEN, GENEXUS_URL, GENEXUS_USER,
# GENEXUS_PASS) cargados en Settings → Secrets, se quita el comentario del horario.
# horario registrado por Gabriel
name: Robot de pagos

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'latido · verificar-acceso · explorar-pagos (lee sin tocar) · ingestar (trae, no aprueba) · aplicar-manuales (aprueba en Optimus solo lo aprobado a mano en el panel) · aplicar (verdes y manuales)'
        type: choice
        default: latido
        options: [latido, verificar-acceso, explorar-pagos, ingestar, aplicar-manuales, aplicar]
      maximo:
        description: 'Cuántos pagos aprobar en esta corrida (modo aplicar)'
        type: string
        default: '25'
  # Cada 20 min, 6 a. m. a 9:40 p. m. Colombia (UTC-5), todos los días. Aprobado por Gabriel el 2026-10-07.
  schedule:
    - cron: '*/20 11-23 * * *'
    - cron: '*/20 0-2 * * *'

concurrency:
  group: robot-pagos
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: robot/pagos-genexus
        run: npm install
      # Sin package-lock, `^1.50.0` trae la versión más nueva de Playwright en cada corrida, y cada
      # versión pide su propia revisión de Chromium. Si la llave del caché solo mira package.json,
      # guarda un navegador viejo y cada ronda vuelve a bajar 120 MB; por eso la llave usa la versión
      # que realmente quedó instalada.
      - name: Versión de Playwright instalada
        id: pw-version
        working-directory: robot/pagos-genexus
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché del navegador
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Descargar el navegador
        if: steps.cache-pw.outputs.cache-hit != 'true'
        working-directory: robot/pagos-genexus
        run: npx playwright install chromium
      - name: Librerías del sistema para el navegador
        working-directory: robot/pagos-genexus
        run: npx playwright install-deps chromium
      - name: Correr el robot
        working-directory: robot/pagos-genexus
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          ROBOT_PAGOS_TOKEN: ${{ secrets.ROBOT_PAGOS_TOKEN }}
          GENEXUS_URL: ${{ secrets.GENEXUS_URL }}
          GENEXUS_USER: ${{ secrets.GENEXUS_USER }}
          GENEXUS_PASS: ${{ secrets.GENEXUS_PASS }}
          # Modo completo desde el 2026-10-07 (decisión de Gabriel tras la prueba de punta a punta):
          # trae los pendientes, GPSITO clasifica, y aprueba en Optimus los verdes y los aprobados a
          # mano, hasta 10 por ronda. Denegar sigue siendo a mano.
          MODO: ${{ inputs.modo || 'aplicar' }}
          MAX_POR_CICLO: ${{ inputs.maximo || '25' }}
        run: node robot.mjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-robot
          path: robot/pagos-genexus/salida/
          if-no-files-found: ignore
          retention-days: 7
